name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  windows-installer-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Parse PowerShell installer and launcher
        shell: pwsh
        run: |
          foreach ($file in @('install.ps1', 'windows/launcher.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error "$file`: $($_.Message)" }
              exit 1
            }
          }
      - name: Validate launcher with Windows PowerShell 5.1 encoding
        shell: powershell
        run: |
          $source = [IO.File]::ReadAllText((Resolve-Path 'windows/launcher.ps1'), [Text.Encoding]::UTF8).TrimStart([char]0xFEFF)
          $encodedLauncher = Join-Path $env:TEMP 'english-profile-generator-launcher.ps1'
          [IO.File]::WriteAllText($encodedLauncher, $source, (New-Object Text.UTF8Encoding($true)))
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            $encodedLauncher,
            [ref]$tokens,
            [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
